<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --top-bar-color: #ededed;
            --bottom-bar-color: #f7f7f7;
            --bubble-left-color: #ffffff;
            --bubble-right-color: #f8eed9;
            --bg-color: #ededed;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-size: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family);
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* 页面切换 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .settings-page {
            display: none;
            background-color: #f5f5f5;
        }

        .settings-page.show {
            display: flex;
        }

        /* 顶部栏通用样式 */
        .top-bar {
            height: 56px;
            background-color: var(--top-bar-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #dcdcdc;
            flex-shrink: 0;
        }
        
        .menu-icon, .back-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .menu-icon span {
            display: block;
            width: 20px;
            height: 2px;
            background-color: #333;
            border-radius: 1px;
        }

        .menu-icon {
            flex-direction: column;
            justify-content: space-around;
            padding: 2px 0;
        }
        
        .doodle-icon {
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .settings-title {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }
        
        /* 聊天内容区 */
        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-size: var(--font-size);
        }
        
        .chat-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-content::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 2px;
        }

        /* 分隔符 */
        .separator-item {
            text-align: center;
            margin: 16px 0;
            color: #bbb;
            font-size: 12px;
        }
        
        .message-item {
            display: flex;
            margin-bottom: 16px;
            align-items: flex-start;
            gap: 8px;
        }
        
        .message-item.right {
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f8eed9;
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            user-select: none;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-emoji {
            line-height: 1;
        }
        
        .message-wrapper {
            max-width: 70%;
            display: flex;
            flex-direction: column;
        }
        
        .message-item.right .message-wrapper {
            align-items: flex-end;
        }
        
        .bubble-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }
        
        .message-item.right .bubble-container {
            flex-direction: row-reverse;
        }
        
        .bubble {
            padding: 10px 12px;
            border-radius: 6px;
            line-height: 1.5;
            word-wrap: break-word;
            cursor: pointer;
            position: relative;
            max-width: 100%;
            color: #333;
        }
        
        .bubble.left {
            background-color: var(--bubble-left-color);
        }
        
        .bubble.left::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid var(--bubble-left-color);
        }
        
        .bubble.right {
            background-color: var(--bubble-right-color);
        }
        
        .bubble.right::before {
            content: '';
            position: absolute;
            right: -6px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 6px solid var(--bubble-right-color);
        }
        
        /* 状态图标 */
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #d9d9d9;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--bg-color);
            margin-bottom: 2px;
        }

        .status-icon.time-mode {
            background: none;
            color: #999;
            font-size: 11px;
            font-weight: normal;
            width: auto;
            height: auto;
            border-radius: 0;
            margin-bottom: 4px;
        }
        
        /* 备注气泡 */
        .remark {
            background-color: #fff;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            word-break: break-all;
            cursor: pointer;
            max-width: 100%;
        }
        
        /* 底部栏 */
        .bottom-bar {
            height: 52px;
            background-color: var(--bottom-bar-color);
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #dcdcdc;
            flex-shrink: 0;
        }
        
        .color-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
        }
        
        .color-toggle.blue {
            background-color: #b8d8ff;
        }
        
        .color-toggle.pink {
            background-color: #ffc8dd;
        }
        
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .message-input {
            width: 100%;
            height: 36px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
            font-family: var(--font-family);
        }
        
        .plus-btn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #666;
            font-weight: 300;
            user-select: none;
        }

        /* 扩展功能面板 */
        .expand-panel {
            height: 104px;
            background-color: var(--bottom-bar-color);
            display: none;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            border-top: 1px solid #dcdcdc;
            flex-shrink: 0;
        }

        .expand-panel.show {
            display: flex;
        }

        .expand-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #666;
            font-size: 12px;
        }

        .expand-item svg {
            color: #333;
            width: 28px;
            height: 28px;
        }

        /* 设置页面内容 */
        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .settings-group {
            background-color: #fff;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .group-title {
            padding: 12px 16px;
            font-size: 14px;
            color: #666;
            background-color: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 15px;
            color: #333;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-item input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .setting-item select, .setting-item input[type="number"] {
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            font-family: var(--font-family);
        }

        .css-textarea {
            width: 100%;
            height: 100px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
            outline: none;
            font-family: monospace;
            margin-top: 8px;
        }

        .upload-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: #666;
            background-color: #fafafa;
        }

        .upload-btn:hover {
            border-color: #b8d8ff;
            color: #b8d8ff;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            background-color: #b8d8ff;
            color: #333;
            margin-bottom: 10px;
            font-family: var(--font-family);
        }

        .btn-danger {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            background-color: #f56c6c;
            color: #fff;
            font-family: var(--font-family);
        }

        .hidden-input {
            display: none;
        }
        
        /* 弹窗通用 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-box {
            width: 280px;
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
        }
        
        .modal-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
        }

        .modal-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .modal-input {
            width: 100%;
            height: 80px;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }
        
        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btns.between {
            justify-content: space-between;
        }

        .modal-btns .left-btns {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        
        .modal-btn.cancel {
            background-color: #f0f0f0;
            color: #666;
        }
        
        .modal-btn.delete {
            background-color: #ffecec;
            color: #f56c6c;
        }

        .modal-btn.danger {
            background-color: #f56c6c;
            color: #fff;
        }

        .modal-btn.confirm {
            background-color: #b8d8ff;
            color: #333;
        }

        /* 头像选择弹窗 */
        .avatar-box {
            width: 320px;
        }
        
        .avatar-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .avatar-option {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background-color: #f0f0f0;
            transition: border-color 0.2s;
        }
        
        .avatar-option:hover, .avatar-option.selected {
            border-color: #b8d8ff;
        }
        
        .avatar-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 16px;
            display: none;
            border: 2px solid #b8d8ff;
        }
        
        .avatar-preview.show {
            display: block;
        }
        
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 聊天页面 -->
        <div class="page chat-page" id="chatPage">
            <!-- 顶部功能栏 -->
            <div class="top-bar">
                <div class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="doodle-icon" id="homeBtn" title="设置">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
            </div>
            
            <!-- 聊天内容显示区 -->
            <div class="chat-content" id="chatContent">
                <!-- 消息动态生成 -->
            </div>
            
            <!-- 底部功能栏 -->
            <div class="bottom-bar">
                <div class="color-toggle blue" id="colorToggle" title="浅蓝色：消息显示在左侧"></div>
                <div class="input-wrapper">
                    <input type="text" class="message-input" id="messageInput" placeholder="输入消息..." onkeydown="handleKeyDown(event)">
                </div>
                <div class="plus-btn" id="plusBtn" title="更多功能">+</div>
            </div>

            <!-- 扩展功能面板 -->
            <div class="expand-panel" id="expandPanel">
                <div class="expand-item" onclick="addSeparator()" title="添加分隔符">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <line x1="4" y1="12" x2="20" y2="12"/>
                    </svg>
                    <span>分隔符</span>
                </div>
                <div class="expand-item" onclick="toggleTimeMode()" title="切换时间/状态">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>时间</span>
                </div>
                <div class="expand-item" title="待开发">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>图片</span>
                </div>
                <div class="expand-item" title="待开发">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span>更多</span>
                </div>
            </div>
        </div>

        <!-- 设置页面 -->
        <div class="page settings-page" id="settingsPage">
            <div class="top-bar">
                <div class="back-icon" id="backBtn">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </div>
                <div class="settings-title">设置</div>
                <div style="width:24px;"></div>
            </div>

            <div class="settings-content">
                <!-- 界面颜色 -->
                <div class="settings-group">
                    <div class="group-title">界面颜色</div>
                    <div class="setting-item">
                        <span>顶部栏颜色</span>
                        <input type="color" id="topBarColor" value="#ededed" oninput="updateColor('topBarColor', this.value)">
                    </div>
                    <div class="setting-item">
                        <span>底部栏颜色</span>
                        <input type="color" id="bottomBarColor" value="#f7f7f7" oninput="updateColor('bottomBarColor', this.value)">
                    </div>
                    <div class="setting-item">
                        <span>背景颜色</span>
                        <input type="color" id="bgColor" value="#ededed" oninput="updateColor('bgColor', this.value)">
                    </div>
                </div>

                <!-- 气泡设置 -->
                <div class="settings-group">
                    <div class="group-title">气泡设置</div>
                    <div class="setting-item">
                        <span>左侧气泡颜色</span>
                        <input type="color" id="bubbleLeftColor" value="#ffffff" oninput="updateColor('bubbleLeftColor', this.value)">
                    </div>
                    <div class="setting-item">
                        <span>右侧气泡颜色</span>
                        <input type="color" id="bubbleRightColor" value="#f8eed9" oninput="updateColor('bubbleRightColor', this.value)">
                    </div>
                    <div class="setting-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                        <span>自定义气泡CSS</span>
                        <textarea class="css-textarea" id="bubbleCss" placeholder="例如：border-radius: 12px;&#10;box-shadow: 0 2px 8px rgba(0,0,0,0.1);" oninput="applyBubbleCss()"></textarea>
                    </div>
                </div>

                <!-- 字体设置 -->
                <div class="settings-group">
                    <div class="group-title">字体设置</div>
                    <div class="setting-item">
                        <span>字体</span>
                        <select id="fontFamily" onchange="updateFont()">
                            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">系统默认</option>
                            <option value="'Noto Sans SC', sans-serif">思源黑体</option>
                            <option value="'Noto Serif SC', serif">思源宋体</option>
                            <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                            <option value="'PingFang SC', sans-serif">苹方</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <span>字号</span>
                        <input type="number" id="fontSize" value="15" min="12" max="20" onchange="updateFont()">
                    </div>
                </div>

                <!-- 背景设置 -->
                <div class="settings-group">
                    <div class="group-title">聊天背景</div>
                    <div class="setting-item">
                        <span>背景图片</span>
                        <label class="upload-btn">
                            上传图片
                            <input type="file" class="hidden-input" accept="image/*" onchange="uploadBgImage(event)">
                        </label>
                    </div>
                    <div class="setting-item">
                        <span>清除背景图</span>
                        <span class="upload-btn" onclick="clearBgImage()">清除</span>
                    </div>
                </div>

                <!-- 数据管理 -->
                <div class="settings-group">
                    <div class="group-title">数据管理</div>
                    <div style="padding: 16px;">
                        <button class="btn-primary" onclick="exportRecords()">导出聊天记录</button>
                        <button class="btn-primary" onclick="exportAll()">导出全部配置</button>
                        <label class="btn-primary" style="display:block; text-align:center;">
                            导入备份文件
                            <input type="file" class="hidden-input" accept=".json" onchange="importData(event)">
                        </label>
                        <button class="btn-danger" onclick="showClearConfirm()">清除所有聊天记录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 备注弹窗 -->
    <div class="modal" id="remarkModal">
        <div class="modal-box">
            <h3>编辑备注</h3>
            <textarea class="modal-input" id="remarkInput" placeholder="请输入备注内容..."></textarea>
            <div class="modal-btns between">
                <div class="left-btns">
                    <button class="modal-btn cancel" onclick="closeRemarkModal()">取消</button>
                    <button class="modal-btn delete" onclick="deleteRemark()">删除</button>
                </div>
                <button class="modal-btn confirm" onclick="saveRemark()">确定</button>
            </div>
        </div>
    </div>
    
    <!-- 头像选择弹窗 -->
    <div class="modal" id="avatarModal">
        <div class="modal-box avatar-box">
            <h3 style="text-align:center;">选择头像</h3>
            <div class="upload-btn" style="text-align:center; margin-bottom:16px;" onclick="document.getElementById('avatarFileInput').click()">
                📷 上传本地图片
            </div>
            <div class="avatar-preview" id="avatarPreview">
                <img id="previewImg" src="" alt="预览">
            </div>
            <div class="avatar-options" id="avatarOptions">
                <div class="avatar-option" data-avatar="😀">😀</div>
                <div class="avatar-option" data-avatar="😎">😎</div>
                <div class="avatar-option" data-avatar="🤖">🤖</div>
                <div class="avatar-option" data-avatar="👤">👤</div>
                <div class="avatar-option" data-avatar="🐱">🐱</div>
                <div class="avatar-option" data-avatar="🐶">🐶</div>
                <div class="avatar-option" data-avatar="🦊">🦊</div>
                <div class="avatar-option" data-avatar="🐼">🐼</div>
            </div>
            <div class="modal-btns" style="justify-content: flex-end;">
                <button class="modal-btn cancel" onclick="closeAvatarModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmAvatar()">确定</button>
            </div>
        </div>
    </div>

    <!-- 清除确认弹窗 -->
    <div class="modal" id="clearConfirmModal">
        <div class="modal-box">
            <h3>确认清除</h3>
            <p>清除前请先备份聊天记录，清除后无法恢复，确定要全部清除吗？</p>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeClearConfirm()">取消</button>
                <button class="modal-btn danger" onclick="clearAllMessages()">确定清除</button>
            </div>
        </div>
    </div>
    
    <input type="file" class="hidden-input" id="avatarFileInput" accept="image/*">

    <!-- 自定义气泡CSS容器 -->
    <style id="customBubbleStyle"></style>

    <script>
        // 全局配置
        const config = {
            topBarColor: '#ededed',
            bottomBarColor: '#f7f7f7',
            bubbleLeftColor: '#ffffff',
            bubbleRightColor: '#f8eed9',
            bgColor: '#ededed',
            bgImage: null,
            fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
            fontSize: '15px',
            bubbleCss: '',
            leftAvatar: null,
            rightAvatar: null,
            isTimeMode: false
        };

        // 消息数据
        let messages = [];
        let messageIdCounter = 0;
        
        // 状态管理
        let isRightSide = false;
        let currentBubbleId = null;
        let currentAvatarSide = null;
        let selectedAvatar = null;
        
        const statusIcons = ['✕', '✓', '?'];
        const chatContent = document.getElementById('chatContent');
        const colorToggle = document.getElementById('colorToggle');
        const messageInput = document.getElementById('messageInput');
        const expandPanel = document.getElementById('expandPanel');

        // 页面切换
        document.getElementById('homeBtn').addEventListener('click', () => {
            document.getElementById('settingsPage').classList.add('show');
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('settingsPage').classList.remove('show');
        });

        // 颜色更新
        function updateColor(type, value) {
            config[type] = value;
            document.documentElement.style.setProperty('--' + type.replace(/([A-Z])/g, '-$1').toLowerCase(), value);
            
            // 同步设置面板输入框的值
            const inputId = type.replace(/([A-Z])/g, function(m){ return m.toLowerCase(); });
            if (document.getElementById(inputId)) {
                document.getElementById(inputId).value = value;
            }
        }

        // 气泡自定义CSS
        function applyBubbleCss() {
            const css = document.getElementById('bubbleCss').value;
            config.bubbleCss = css;
            document.getElementById('customBubbleStyle').textContent = `.bubble { ${css} }`;
        }

        // 字体更新
        function updateFont() {
            const family = document.getElementById('fontFamily').value;
            const size = document.getElementById('fontSize').value + 'px';
            config.fontFamily = family;
            config.fontSize = size;
            document.documentElement.style.setProperty('--font-family', family);
            document.documentElement.style.setProperty('--font-size', size);
        }

        // 背景图片上传
        function uploadBgImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                config.bgImage = event.target.result;
                chatContent.style.backgroundImage = `url(${config.bgImage})`;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function clearBgImage() {
            config.bgImage = null;
            chatContent.style.backgroundImage = 'none';
        }

        // 颜色切换按钮
        colorToggle.addEventListener('click', function() {
            isRightSide = !isRightSide;
            if (isRightSide) {
                colorToggle.classList.remove('blue');
                colorToggle.classList.add('pink');
                colorToggle.title = '浅粉色：消息显示在右侧';
            } else {
                colorToggle.classList.remove('pink');
                colorToggle.classList.add('blue');
                colorToggle.title = '浅蓝色：消息显示在左侧';
            }
        });

        // 加号按钮
        document.getElementById('plusBtn').addEventListener('click', function() {
            expandPanel.classList.toggle('show');
        });

        // 渲染头像
        function renderAvatarContent(avatar) {
            if (!avatar) return '';
            if (avatar.startsWith('data:') || avatar.startsWith('http')) {
                return `<img src="${avatar}" alt="avatar">`;
            } else {
                return `<span class="avatar-emoji">${avatar}</span>`;
            }
        }

        // 格式化时间
        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }
        
        // 发送消息
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            const msgId = 'msg_' + (++messageIdCounter);
            const side = isRightSide ? 'right' : 'left';
            const avatar = isRightSide ? config.rightAvatar : config.leftAvatar;
            const sendTime = formatTime(new Date());

            // 存入数据
            messages.push({
                id: msgId,
                type: 'message',
                side: side,
                content: text,
                statusIndex: 1,
                time: sendTime,
                remark: ''
            });

            renderMessage(messages[messages.length - 1]);
            messageInput.value = '';
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 渲染单条消息
        function renderMessage(msg) {
            const avatar = msg.side === 'right' ? config.rightAvatar : config.leftAvatar;
            const statusText = config.isTimeMode ? msg.time : statusIcons[msg.statusIndex];
            
            const msgHtml = `
                <div class="message-item ${msg.side}" id="${msg.id}">
                    <div class="avatar" onclick="openAvatarModal('${msg.side}')" data-side="${msg.side}">
                        ${renderAvatarContent(avatar)}
                    </div>
                    <div class="message-wrapper">
                        <div class="bubble-container">
                            <div class="bubble ${msg.side}" onclick="openRemarkModal('${msg.id}')">${escapeHtml(msg.content)}</div>
                            <div class="status-icon ${config.isTimeMode ? 'time-mode' : ''}" 
                                 onclick="toggleStatus(this, '${msg.id}')" 
                                 data-status-index="${msg.statusIndex}" 
                                 data-time="${msg.time}">
                                ${statusText}
                            </div>
                        </div>
                        <div class="remark" style="${msg.remark ? 'display:block;' : 'display:none;'}" onclick="openRemarkModal('${msg.id}')">${escapeHtml(msg.remark || '')}</div>
                    </div>
                </div>
            `;
            chatContent.insertAdjacentHTML('beforeend', msgHtml);
        }

        // 添加分隔符
        function addSeparator() {
            messages.push({
                id: 'sep_' + Date.now(),
                type: 'separator'
            });
            const sepHtml = `<div class="separator-item">—— 分隔线 ——</div>`;
            chatContent.insertAdjacentHTML('beforeend', sepHtml);
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 切换时间/状态模式
        function toggleTimeMode() {
            config.isTimeMode = !config.isTimeMode;
            const allStatus = document.querySelectorAll('.status-icon');
            
            allStatus.forEach(el => {
                if (config.isTimeMode) {
                    el.textContent = el.getAttribute('data-time');
                    el.classList.add('time-mode');
                } else {
                    const index = parseInt(el.getAttribute('data-status-index'));
                    el.textContent = statusIcons[index];
                    el.classList.remove('time-mode');
                }
            });
        }
        
        // 回车发送
        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 切换状态
        function toggleStatus(element, msgId) {
            if (config.isTimeMode) return;
            let index = parseInt(element.getAttribute('data-status-index'));
            index = (index + 1) % statusIcons.length;
            element.setAttribute('data-status-index', index);
            element.textContent = statusIcons[index];

            // 更新数据
            const msg = messages.find(m => m.id === msgId);
            if (msg) msg.statusIndex = index;
        }
        
        // 备注弹窗
        function openRemarkModal(msgId) {
            currentBubbleId = msgId;
            const msg = messages.find(m => m.id === msgId);
            document.getElementById('remarkInput').value = msg ? msg.remark : '';
            document.getElementById('remarkModal').classList.add('show');
        }
        
        function closeRemarkModal() {
            document.getElementById('remarkModal').classList.remove('show');
            currentBubbleId = null;
        }
        
        function saveRemark() {
            const remarkText = document.getElementById('remarkInput').value.trim();
            if (!currentBubbleId) return;
            
            const msg = messages.find(m => m.id === currentBubbleId);
            const remarkEl = document.querySelector('#' + currentBubbleId + ' .remark');
            
            if (msg) msg.remark = remarkText;
            if (remarkText) {
                remarkEl.textContent = remarkText;
                remarkEl.style.display = 'block';
            } else {
                remarkEl.textContent = '';
                remarkEl.style.display = 'none';
            }
            closeRemarkModal();
        }

        function deleteRemark() {
            if (!currentBubbleId) return;
            const msg = messages.find(m => m.id === currentBubbleId);
            const remarkEl = document.querySelector('#' + currentBubbleId + ' .remark');
            
            if (msg) msg.remark = '';
            remarkEl.textContent = '';
            remarkEl.style.display = 'none';
            closeRemarkModal();
        }
        
        // 头像弹窗
        function openAvatarModal(side) {
            currentAvatarSide = side;
            selectedAvatar = null;
            
            document.getElementById('avatarPreview').classList.remove('show');
            document.querySelectorAll('.avatar-option').forEach(el => {
                el.classList.remove('selected');
            });
            
            document.getElementById('avatarModal').classList.add('show');
        }
        
        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.remove('show');
            currentAvatarSide = null;
            selectedAvatar = null;
            document.getElementById('avatarFileInput').value = '';
        }
        
        function confirmAvatar() {
            if (selectedAvatar === null || !currentAvatarSide) {
                closeAvatarModal();
                return;
            }
            
            if (currentAvatarSide === 'left') {
                config.leftAvatar = selectedAvatar;
            } else {
                config.rightAvatar = selectedAvatar;
            }
            
            document.querySelectorAll('.message-item.' + currentAvatarSide + ' .avatar').forEach(el => {
                el.innerHTML = renderAvatarContent(selectedAvatar);
            });
            
            closeAvatarModal();
        }
        
        document.querySelectorAll('.avatar-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.avatar-option').forEach(el => {
                    el.classList.remove('selected');
                });
                this.classList.add('selected');
                selectedAvatar = this.getAttribute('data-avatar');
                document.getElementById('avatarPreview').classList.remove('show');
            });
        });
        
        document.getElementById('avatarFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedAvatar = event.target.result;
                document.getElementById('previewImg').src = selectedAvatar;
                document.getElementById('avatarPreview').classList.add('show');
                document.querySelectorAll('.avatar-option').forEach(el => {
                    el.classList.remove('selected');
                });
            };
            reader.readAsDataURL(file);
        });

        // 导出聊天记录
        function exportRecords() {
            const data = JSON.stringify(messages, null, 2);
            downloadFile(data, `chat-records-${Date.now()}.json`, 'application/json');
        }

        // 导出全部配置
        function exportAll() {
            const fullData = {
                config: config,
                messages: messages,
                messageIdCounter: messageIdCounter
            };
            const data = JSON.stringify(fullData, null, 2);
            downloadFile(data, `chat-backup-${Date.now()}.json`, 'application/json');
        }

        // 下载文件工具
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导入数据
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    
                    // 判断是完整备份还是仅聊天记录
                    if (data.config && data.messages) {
                        // 完整备份恢复
                        Object.assign(config, data.config);
                        messages = data.messages;
                        messageIdCounter = data.messageIdCounter || messages.length;
                        
                        // 应用所有配置
                        applyAllConfig();
                        // 重新渲染所有消息
                        renderAllMessages();
                        alert('导入成功！所有配置与聊天记录已恢复');
                    } else if (Array.isArray(data)) {
                        // 仅聊天记录
                        messages = data;
                        messageIdCounter = messages.length;
                        renderAllMessages();
                        alert('聊天记录导入成功！');
                    } else {
                        alert('文件格式不正确，请导入正确的备份文件');
                    }
                } catch (err) {
                    alert('导入失败：文件解析错误');
                    console.error(err);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // 应用所有配置
        function applyAllConfig() {
            // 颜色
            updateColor('topBarColor', config.topBarColor);
            updateColor('bottomBarColor', config.bottomBarColor);
            updateColor('bubbleLeftColor', config.bubbleLeftColor);
            updateColor('bubbleRightColor', config.bubbleRightColor);
            updateColor('bgColor', config.bgColor);
            
            // 字体
            document.getElementById('fontFamily').value = config.fontFamily;
            document.getElementById('fontSize').value = parseInt(config.fontSize);
            updateFont();
            
            // 气泡CSS
            document.getElementById('bubbleCss').value = config.bubbleCss;
            applyBubbleCss();
            
            // 背景图
            if (config.bgImage) {
                chatContent.style.backgroundImage = `url(${config.bgImage})`;
            } else {
                chatContent.style.backgroundImage = 'none';
            }

            // 时间模式
            if (config.isTimeMode) {
                // 确保状态同步
            }
        }

        // 重新渲染所有消息
        function renderAllMessages() {
            chatContent.innerHTML = '';
            messages.forEach(item => {
                if (item.type === 'separator') {
                    chatContent.insertAdjacentHTML('beforeend', `<div class="separator-item">—— 分隔线 ——</div>`);
                } else {
                    renderMessage(item);
                }
            });
            chatContent.scrollTop = chatContent.scrollHeight;
        }

        // 清除确认弹窗
        function showClearConfirm() {
            document.getElementById('clearConfirmModal').classList.add('show');
        }

        function closeClearConfirm() {
            document.getElementById('clearConfirmModal').classList.remove('show');
        }

        function clearAllMessages() {
            messages = [];
            messageIdCounter = 0;
            chatContent.innerHTML = '';
            closeClearConfirm();
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 点击弹窗外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('show');
                }
            });
        });
        
        // 初始化
        window.onload = function() {
            messageInput.focus();
        };
    </script>
</body>
</html>
